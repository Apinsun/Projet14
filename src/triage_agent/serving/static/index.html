<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent de triage — CHSA</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --patient:#2563eb; --think:#fef3c7; --border:#e5e7eb; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); }
  header { background:#111827; color:#fff; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:16px; margin:0; }
  header button { background:#2563eb; color:#fff; border:0; padding:8px 14px; border-radius:6px; cursor:pointer; font-size:14px; }
  #chat { max-width:820px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:78%; padding:10px 14px; border-radius:12px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word; }
  .patient { align-self:flex-end; background:var(--patient); color:#fff; }
  .agent { align-self:flex-start; background:var(--card); border:1px solid var(--border); }
  .agent .label { font-size:11px; color:#6b7280; margin-bottom:6px; }
  details.think { background:var(--think); border:1px solid #f59e0b33; border-radius:8px; padding:8px 10px; margin-bottom:8px; font-size:13px; }
  details.think summary { cursor:pointer; font-weight:600; color:#92400e; }
  details.think p { white-space:pre-wrap; margin:6px 0 0; color:#78350f; }
  .fiche { background:#f0fdf4; border:1px solid #16a34a33; border-radius:8px; padding:8px 10px; margin-bottom:8px; font-size:12px; }
  .fiche .prio { display:inline-block; padding:2px 8px; border-radius:10px; color:#fff; font-weight:700; margin-bottom:6px; }
  .fiche pre { margin:0; white-space:pre-wrap; word-wrap:break-word; font-family:ui-monospace,monospace; }
  .fiche.parse-fail { background:#fef2f2; border-color:#dc262633; color:#991b1b; }
  #composer { max-width:820px; margin:0 auto; padding:0 16px 16px; display:flex; gap:8px; }
  #input { flex:1; padding:12px; border-radius:8px; border:1px solid var(--border); font-size:15px; }
  #send { background:#2563eb; color:#fff; border:0; padding:12px 20px; border-radius:8px; cursor:pointer; font-size:15px; }
  #send:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header>
  <h1>🩺 Agent de triage médical — CHSA (démo)</h1>
  <button id="new">Nouvelle conversation</button>
</header>
<main id="chat"></main>
<div id="composer">
  <input id="input" placeholder="Décrivez ce qui vous amène…" autocomplete="off">
  <button id="send">Envoyer</button>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const send = document.getElementById('send');
const newBtn = document.getElementById('new');

let messages = [];  // historique complet (envoyé tel quel à l'API, stateless)
let conversationId = crypto.randomUUID();

const PRIO_COLORS = {1:'#dc2626', 2:'#ea580c', 3:'#f59e0b', 4:'#16a34a', 5:'#22c55e'};

function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function addBubble(role, html) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'patient' : 'agent');
  div.innerHTML = html;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function priority(fiche) {
  const args = fiche && fiche.arguments;
  const p = args ? args.priority : (fiche ? fiche.priority : null);
  return (p !== null && p !== undefined) ? p : null;
}

function renderAgent(data) {
  let html = '<div class="label">🤖 Agent</div>';
  if (data.think) {
    html += '<details class="think"><summary>💭 thinking</summary><p>' + escapeHtml(data.think) + '</p></details>';
  }
  if (data.fiche) {
    const p = priority(data.fiche);
    const badge = p ? '<span class="prio" style="background:' + (PRIO_COLORS[p] || '#6b7280') + '">niveau ' + p + '</span>' : '';
    html += '<div class="fiche">' + badge + '<pre>' + escapeHtml(JSON.stringify(data.fiche, null, 2)) + '</pre></div>';
  } else if (!data.parse_ok) {
    html += '<div class="fiche parse-fail">⚠️ fiche mal formée — texte brut ci-dessous</div>';
  }
  html += '<div>' + escapeHtml(data.reply) + '</div>';
  addBubble('assistant', html);
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addBubble('user', escapeHtml(text));
  messages.push({role:'user', content:text});
  send.disabled = true;
  try {
    const resp = await fetch('/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({messages, conversation_id: conversationId})
    });
    const data = await resp.json();
    if (!resp.ok) {
      addBubble('assistant', '<div class="label">⚠️ erreur</div>' + escapeHtml(JSON.stringify(data)));
      return;
    }
    // on remet la sortie brute dans l'historique (think + fiche + explication),
    // comme pendant l'entraînement.
    messages.push({role:'assistant', content: data.raw});
    renderAgent(data);
  } catch (e) {
    addBubble('assistant', '<div class="label">⚠️ erreur réseau</div>' + escapeHtml(String(e)));
  } finally {
    send.disabled = false;
    input.focus();
  }
}

send.addEventListener('click', sendMessage);
input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
newBtn.addEventListener('click', () => {
  messages = [];
  conversationId = crypto.randomUUID();
  chat.innerHTML = '';
  addBubble('assistant', '<div class="label">🤖 Agent</div>Bonjour, je suis l\'agent de triage. Décrivez-moi ce qui vous amène.');
});
newBtn.click();
</script>
</body>
</html>
