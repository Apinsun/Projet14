services:
  vllm:
    # Version alignée sur le venv local (.venv-vllm : vLLM 0.29.0)
    image: vllm/vllm-openai:v0.29.0
    command:
      - --model
      - /models/lora_dpo_v3_merged
      - --served-model-name
      - triage
      - --enforce-eager
      - --max-model-len
      - "8192"
      - --port
      - "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./models/lora_dpo_v3_merged:/models/lora_dpo_v3_merged:ro
    environment:
      - VLLM_USE_FLASHINFER_SAMPLER=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - TRIAGE_VLLM_URL=http://vllm:8000/v1
      - TRIAGE_VLLM_MODEL=triage
      - TRIAGE_AUDIT_PATH=/app/logs/audit.jsonl
    volumes:
      - ./logs:/app/logs
    depends_on:
      - vllm
