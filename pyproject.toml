[tool.poetry]
name = "triage-agent"
version = "0.1.0"
description = "POC d'un agent IA de triage médical pour le CHSA — fine-tuning Qwen3-1.7B (SFT + DPO)"
authors = ["arnaud pinsun <arnaudpinsun@gmail.com>"]
readme = "README.md"
package-mode = true
packages = [{ include = "triage_agent", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
datasets = "^5.0.1"
huggingface-hub = "^1.30.0"
pandas = "^3.0.5"
pyarrow = "^25.0.1"
matplotlib = "^3.11.1"
python-dotenv = "^1.2.3"
tqdm = "^4.70.0"
langdetect = "^1.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.9.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
